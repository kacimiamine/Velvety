name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - "ver/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"

      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Get Minecraft Version
        run: |
          MC_VERSION=$(grep '^mcVersion=' gradle.properties | cut -d= -f2)
          CHANNEL=$(grep '^channel=' gradle.properties | cut -d= -f2)
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=${CHANNEL,,}" >> "$GITHUB_ENV"

      - name: Get Build Number
        run: |
          LATEST_BUILD=$(git tag | grep -E "^velvety-$MC_VERSION-" | sed "s/^velvety-$MC_VERSION-//" | sort -nr | head -n1)
          LATEST_BUILD=${LATEST_BUILD:-0}
          echo "BUILD_NUMBER=$((LATEST_BUILD + 1))" >> "$GITHUB_ENV"
          if [ "$LATEST_BUILD" != 0 ]; then echo "PREV_TAG=velvety-$MC_VERSION-$LATEST_BUILD" >> "$GITHUB_ENV"; fi

      - name: Create PaperclipJar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rename Jar
        run: |
          mv velvety-server/build/libs/velvety-paperclip-$MC_VERSION.build.$BUILD_NUMBER-$CHANNEL.jar velvety-$MC_VERSION-$BUILD_NUMBER.jar

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; else RANGE="-1"; fi
          git log $RANGE --pretty=format:"- %s (%h) - %an" > changelog.md
          gh release create velvety-$MC_VERSION-$BUILD_NUMBER velvety-$MC_VERSION-$BUILD_NUMBER.jar \
            --target ${{ github.sha }} \
            --title "Velvety $MC_VERSION build $BUILD_NUMBER" \
            --notes-file changelog.md

      - name: Delete Old Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 100 --json tagName -q '.[10:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes
